# Builds the Vite app and rsyncs the static output to the nginx docroot.
# nginx serves /var/www/html/cthulhu.cyrusnimda.com/dist, so only dist/ is deployed.

name: Cthulhu deploy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install pnpm and Node.js
      uses: pnpm/setup@v2
      with:
        runtime: node@24
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
    - run: pnpm test
    - run: pnpm build
    - name: Deploy to Production server
      if: github.event_name == 'push'
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: "-rlgoDzvc -i --delete"
        SOURCE: "dist/"
        REMOTE_HOST: "ssh.cyrusnimda.com"
        REMOTE_USER: "josu"
        TARGET: "/var/www/html/cthulhu.cyrusnimda.com/dist"
